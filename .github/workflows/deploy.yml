name: Deploy to Cloudflare

# Deployt den Worker „little-schoolapp" automatisch bei jedem Push auf main.
# Voraussetzung: zwei GitHub-Secrets (Repo → Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN   (Token mit der Berechtigung „Edit Cloudflare Workers")
#   - CLOUDFLARE_ACCOUNT_ID  (Account-ID aus dem Cloudflare-Dashboard)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur ein Deploy gleichzeitig; neuere Pushes lösen einen neuen Lauf aus.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Ohne command führt die Action `wrangler deploy` aus
          # (nutzt name, assets und KV-Binding aus wrangler.toml).
